#        max-file: "10"
#    networks:
#      - local
#    depends_on:
#      - mysql_db
#    mem_reservation: 500M

  mysql_db:
    networks:
      - local
    container_name: mysql_db
    image: library/mysql:8.0
#    dns:
    mem_reservation: 1G
    volumes:
      - storage:/opt/data
    ports:
      - ${MYSQL_LOCAL_PORT}:${MYSQL_DOCKER_PORT}
    env_file:
      - .env
    environment:
      MYSQL_ROOT_USER: ${MYSQL_USER}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

  redis:
    image: redis:7.0.5
    container_name: redis_cache
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    networks:
      - local

volumes:
  storage:
networks:
  local:
    name: local

