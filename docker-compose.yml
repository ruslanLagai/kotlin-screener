version: "3.9"
services:

  webapp:
    image: ruslanlagai/screener-kotlin:3.5
    container_name: screener-kotlin
    env_file:
      - .env
    environment:
      SPRING_APPLICATION_JSON: '{
                  "spring.datasource.url"  : "jdbc:mysql://mysql_db:$MYSQL_DOCKER_PORT/$MYSQL_DATABASE?allowPublicKeyRetrieval=true",
                  "spring.datasource.username" : "$MYSQL_USER",
                  "spring.datasource.password" : "$MYSQL_ROOT_PASSWORD",
                  "spring.jpa.properties.hibernate.dialect" : "org.hibernate.dialect.MySQL8Dialect",
                  "spring.jpa.hibernate.ddl-auto" : "create-drop"
                }'
    healthcheck:
      test: curl -f http://localhost:8080 || exit 1
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    networks:
      - local
#    ports:
#      - ${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}
    depends_on:
      - mysql_db
#      - redis_cache
    restart: on-failure
    mem_reservation: 1G

